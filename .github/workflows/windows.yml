name: Private native Windows tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git
      - name: Materialize native controller
        shell: pwsh
        run: |
          ./prepare.ps1
          New-Item dist/engine,dist/licenses,evidence -ItemType Directory -Force
          $env:CGO_ENABLED='0'
          Push-Location src
          go test -v ./... | Tee-Object ../evidence/unit-results.txt
          if($LASTEXITCODE -ne 0){throw 'Unit tests failed'}
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../dist/SmallAI.exe .
          if($LASTEXITCODE -ne 0){throw 'Go build failed'}
          Pop-Location
      - name: Build pinned minimal GNU CPU engine
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp engine-src
          git -C engine-src checkout 47c786924ad1ab7e91da2cdc72fcdb563780c2bd
          cmake -S engine-src -B engine-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_FLAGS=-D_WIN32_WINNT=0x0A00 -DCMAKE_CXX_FLAGS=-D_WIN32_WINNT=0x0A00 -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_RPC=OFF -DMTMD_VIDEO=OFF -DGGML_BACKEND_DL=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_BORINGSSL=OFF -DLLAMA_BUILD_LIBRESSL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_UI=OFF -DCMAKE_EXE_LINKER_FLAGS='-static -static-libgcc -static-libstdc++'
          cmake --build engine-build --target llama-server -j 4
          cp engine-build/bin/llama-server.exe dist/engine/
          cp engine-src/LICENSE dist/licenses/llama-MIT.txt
          cp engine-src/vendor/cpp-httplib/LICENSE dist/licenses/cpp-httplib-MIT.txt
          cp engine-src/licenses/LICENSE-jsonhpp dist/licenses/nlohmann-json-MIT.txt
          sed -n '1,32p' engine-src/vendor/sheredom/subprocess.h > dist/licenses/subprocess-Unlicense.txt
          sed -n '/ALTERNATIVE A - MIT License/,$p' engine-src/vendor/stb/stb_image.h > dist/licenses/stb-image-notice.txt
          sed -n '/ALTERNATIVE 1 - Public Domain/,$p' engine-src/vendor/miniaudio/miniaudio.h > dist/licenses/miniaudio-notice.txt
          test -s dist/licenses/miniaudio-notice.txt
          cp /mingw64/share/licenses/mingw-w64/COPYING* dist/licenses/ 2>/dev/null || true
          for f in /mingw64/share/licenses/gcc/* /mingw64/share/licenses/mingw-w64/*; do if [ -f "$f" ]; then cp "$f" "dist/licenses/GNU-$(basename "$f")"; fi; done
          objdump -p dist/engine/llama-server.exe > evidence/engine-imports.txt
          if grep -Ei 'DLL Name:.*(VCRUNTIME|MSVCP|libstdc|libgcc|libwinpthread|libomp)' evidence/engine-imports.txt; then echo 'Unwanted runtime dependency'; exit 1; fi
          find dist -type f | sort > evidence/package-files.txt
      - name: Bundle verified component notices only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item README.md dist
          Copy-Item LICENSE-INVENTORY.md dist
          Copy-Item yarn-MIT.txt,llamafile-MIT.txt dist/licenses
          Invoke-WebRequest https://raw.githubusercontent.com/golang/go/go1.25.1/LICENSE -OutFile dist/licenses/Go-BSD.txt
          Invoke-WebRequest https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/90862c4/LICENSE -OutFile dist/licenses/Qwen3-Apache.txt
          Invoke-WebRequest https://www.apache.org/licenses/LICENSE-2.0.txt -OutFile dist/licenses/Granite-Apache.txt
          Invoke-WebRequest https://huggingface.co/ibm-granite/granite-4.0-1b-GGUF/raw/b27c2fe3f211b7f44e80fa620177aea371099aaa/README.md -OutFile dist/licenses/Granite-model-card.md
          if(!(Test-Path dist/licenses/GNU-COPYING.RUNTIME) -or !(Test-Path dist/licenses/GNU-COPYING3)){throw 'GNU runtime notices missing'}
          Invoke-WebRequest https://raw.githubusercontent.com/mingw-w64/mingw-w64/master/COPYING.MinGW-w64-runtime/COPYING.MinGW-w64-runtime.txt -OutFile dist/licenses/MinGW-runtime.txt
          if(!(Test-Path dist/engine/llama-server.exe)){throw 'Engine missing'}
      - name: Real local model regression
        shell: pwsh
        run: |
          $env:SMALLAI_INTEGRATION='1'
          $env:SMALLAI_MODEL_DIR=Join-Path $env:RUNNER_TEMP 'Small AI Native Models'
          $env:SMALLAI_ENGINE=Join-Path $pwd 'dist/engine/llama-server.exe'
          Push-Location src
          go test -v -timeout 30m -run TestWindowsModels ./... | Tee-Object ../evidence/model-results.txt
          if($LASTEXITCODE -ne 0){throw 'Real model tests failed'}
          Pop-Location
      - name: Render actual browser UI on Windows
        shell: pwsh
        run: |
          python -m pip install selenium
          @'
          import os,time,json,urllib.request
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import Select,WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          os.environ['SMALLAI_SESSION_FILE']=os.path.abspath('evidence/session.txt')
          os.environ['SMALLAI_NO_BROWSER']='1'
          os.environ['SMALLAI_MODEL_DIR']=os.path.join(os.environ['RUNNER_TEMP'],'Small AI Native Models')
          import subprocess
          proc=subprocess.Popen(['dist/SmallAI.exe'])
          for _ in range(60):
              if os.path.exists('evidence/session.txt'): break
              time.sleep(.5)
          url=open('evidence/session.txt').read()
          opts=webdriver.EdgeOptions();opts.add_argument('--headless=new');opts.add_argument('--disable-gpu');opts.add_argument('--window-size=1180,900')
          driver=webdriver.Edge(options=opts);driver.get(url)
          wait=WebDriverWait(driver,30)
          wait.until(lambda d:'Choose a model' in d.find_element(By.ID,'status').text)
          driver.save_screenshot('evidence/ui-home.png')
          Select(driver.find_element(By.ID,'model')).select_by_value('1')
          assert driver.find_element(By.ID,'note').is_displayed()
          assert driver.find_element(By.ID,'summary').get_attribute('disabled')
          driver.save_screenshot('evidence/ui-granite.png')
          driver.set_window_size(760,900);driver.save_screenshot('evidence/ui-narrow-top.png')
          driver.execute_script('window.scrollTo(0,document.body.scrollHeight)');driver.save_screenshot('evidence/ui-narrow-bottom.png')
          driver.set_window_size(1180,900);driver.execute_script('window.scrollTo(0,0)')
          driver.find_element(By.ID,'use').click()
          wait=WebDriverWait(driver,240);wait.until(lambda d:'Ready.' in d.find_element(By.ID,'status').text)
          Select(driver.find_element(By.ID,'task')).select_by_value('rewrite')
          driver.find_element(By.ID,'input').send_keys('Maya paid $1,250.50 on 8 October 2026. Invoice A-17 is unpaid. Delivery is not confirmed.')
          driver.find_element(By.ID,'ask').click()
          wait.until(lambda d:'Done.' in d.find_element(By.ID,'status').text)
          assert driver.find_element(By.ID,'output').text.strip()
          driver.save_screenshot('evidence/ui-answer.png')
          driver.find_element(By.ID,'stop').click();wait.until(lambda d:'Stopped.' in d.find_element(By.ID,'status').text)
          driver.find_element(By.ID,'remove').click();driver.find_element(By.ID,'no').click()
          assert os.path.exists(os.path.join(os.environ['SMALLAI_MODEL_DIR'],'granite-4.0-1b-Q8_0.gguf'))
          driver.find_element(By.ID,'quit').click();proc.wait(timeout=15)
          driver.quit();os.remove('evidence/session.txt')
          open('evidence/ui-results.txt','w').write('PASS desktop/narrow render, Granite note/summary disable, real Use/Rewrite/Stop, Remove cancel, Quit process exit')
          '@ | Set-Content -Encoding utf8 ui-test.py
          python ui-test.py
          if($LASTEXITCODE -ne 0){throw 'Browser UI test failed'}
          Get-ChildItem dist -Recurse -File | Get-FileHash | Format-Table -AutoSize | Out-File evidence/package-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SmallAI-native-private
          path: |
            dist
            evidence
          retention-days: 2
